name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependecies
        run: |
          sudo apt update
          sudo apt install -y \
          build-essential \
          cmake \
          libgtest-dev \
          libgmock-dev \
          libcurl4-openssl-dev \
          libasio-dev \
          libxml2-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE live

  asan:
    runs-on: ubuntu-22.04
    steps:

      - uses: actions/checkout@v4

      - name: Install dependecies
        run: |
          sudo apt update
          sudo apt install -y \
          build-essential \
          cmake \
          libgtest-dev \
          libgmock-dev \
          libcurl4-openssl-dev \
          libasio-dev \
          libxml2-dev
      - name: Configure with ASan
        run: cmake -S . -B build-asan \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure -LE live
